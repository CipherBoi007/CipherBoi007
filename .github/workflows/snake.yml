name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#0A0A0A&color_dots=#EDEDED,#BDBDBD,#8A8A8A,#525252,#1A1A1A
            dist/snake-dark.svg?palette=github-dark&color_snake=#F5F5F5&color_dots=#161616,#3A3A3A,#6B6B6B,#A3A3A3,#E5E5E5

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
